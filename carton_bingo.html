<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartón de Bingo Interactivo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #f6fafd;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 1em;
            color: #2a4d69;
        }
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 95vw;
            width: 400px;
            margin: 2em auto;
            background: #e3eaf2;
            border-radius: 12px;
            box-shadow: 0 2px 12px #0001;
            padding: 12px;
        }
        .bingo-cell, .bingo-header {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            border-radius: 8px;
            user-select: none;
            transition: background 0.2s, color 0.2s;
        }
        .bingo-header {
            background: #2a4d69;
            color: #fff;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .bingo-cell {
            background: #fff;
            color: #2a4d69;
            border: 2px solid #b0c4de;
            cursor: pointer;
        }
        .bingo-cell.marked {
            background: #f9d423;
            color: #222;
            border-color: #f9d423;
            font-weight: bold;
            box-shadow: 0 0 0 2px #f9d42355;
        }
        @media (max-width: 600px) {
            .bingo-board {
                width: 98vw;
                padding: 4vw;
            }
        }
    </style>
</head>
<body>
    <h1>Cartón de Bingo Interactivo</h1>
    <div class="bingo-board" id="bingo-board">
        <!-- Generado por JS -->
    </div>
    <script>
        const LETRAS_ORDEN = ['B', 'I', 'N', 'G', 'O'];

        function generarCartonBingo() {
            const carton = [];
            for (const letra of LETRAS_ORDEN) {
                let min, max;
                switch(letra) {
                    case 'B': min = 1; max = 18; break;
                    case 'I': min = 19; max = 36; break;
                    case 'N': min = 37; max = 54; break;
                    case 'G': min = 55; max = 72; break;
                    case 'O': min = 73; max = 90; break;
                }
                const disponibles = [];
                for (let i = min; i <= max; i++) disponibles.push(i);
                // Mezclar
                for (let i = disponibles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [disponibles[i], disponibles[j]] = [disponibles[j], disponibles[i]];
                }
                carton.push(disponibles.slice(0, 5));
            }

            // Transponer
            const transpuesto = [];
            for (let fila = 0; fila < 5; fila++) {
                transpuesto.push([]);
                for (let col = 0; col < 5; col++) {
                    transpuesto[fila].push(carton[col][fila]);
                }
            }
            return transpuesto;
        }

        function renderCarton() {
            const board = document.getElementById('bingo-board');
            const carton = generarCartonBingo();
            board.innerHTML = '';

            // Encabezados
            LETRAS_ORDEN.forEach(letra => {
                const div = document.createElement('div');
                div.className = 'bingo-header';
                div.textContent = letra;
                board.appendChild(div);
            });

            // Celdas
            for (const fila of carton) {
                for (const numero of fila) {
                    const div = document.createElement('div');
                    div.className = 'bingo-cell';
                    div.textContent = numero;
                    div.addEventListener('click', () => div.classList.toggle('marked'));
                    board.appendChild(div);
                }
            }
        }

        renderCarton();
    </script>
</body>
</html>
