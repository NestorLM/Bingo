<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - Panel Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #f4f8fb;
            --card: #ffffff;
            --ink: #1f2a37;
            --muted: #5f6b7a;
            --primary: #0d6efd;
            --primary-dark: #0b57ca;
            --secondary: #6b7280;
            --secondary-dark: #4b5563;
            --accent: #16a34a;
            --highlight: #ffe58f;
            --border: #d7e3ef;
            --header-bg: #0f3d7a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 15%, #e8f1ff 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #e8fff1 0%, transparent 30%),
                var(--bg);
            min-height: 100vh;
        }

        /* ====== Layout principal ====== */
        .layout {
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }

        /* ====== Cards ====== */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(16, 24, 40, 0.08);
            padding: clamp(8px, 1.5vw, 16px);
        }

        .label {
            margin: 0 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: clamp(0.6rem, 1.2vw, 0.75rem);
            color: var(--muted);
        }

        .sub { margin: 0; color: var(--muted); font-size: clamp(0.75rem, 1.3vw, 0.9rem); }

        /* ====== Hero (número actual) ====== */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 3vw, 32px) 8px;
            text-align: center;
        }

        .numero-grande {
            font-size: clamp(3rem, 10vw, 7rem);
            line-height: 1;
            font-weight: 700;
            color: #0f172a;
            margin: 8px 0;
        }

        /* ====== Panel de control ====== */
        .control-section {
            padding: clamp(8px, 1.5vw, 16px);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: clamp(1.3rem, 2.5vw, 2.1rem);
            color: var(--header-bg);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: clamp(8px, 1.2vw, 12px) clamp(14px, 2vw, 20px);
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: transform 0.18s ease, filter 0.18s ease;
            white-space: nowrap;
        }

        .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        .btn-primary { background: var(--primary); }
        .btn-secondary { background: var(--secondary); }

        #fin-mensaje {
            display: none;
            color: #b91c1c;
            font-weight: 600;
            margin: 8px 0;
            text-align: center;
            font-size: clamp(0.85rem, 1.5vw, 1rem);
        }

        .qr-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: clamp(0.6rem, 1.1vw, 0.8rem);
            color: var(--muted);
        }

        .qr-wrap > span { text-align: center; white-space: nowrap; }

        /* ====== Tabla de números - SIEMPRE visible ====== */
        .table-wrap {
            width: 100%;
            overflow: visible;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            background: var(--header-bg);
            color: #fff;
            padding: clamp(4px, 0.8vw, 8px);
            font-size: clamp(0.7rem, 1.3vw, 0.95rem);
            text-align: center;
        }

        th, td {
            border: 1px solid var(--border);
            text-align: center;
            padding: clamp(3px, 0.5vw, 6px);
            font-size: clamp(0.6rem, 1.1vw, 0.88rem);
            line-height: 1.2;
        }

        td { background: #fbfdff; transition: background 0.3s; }
        td.selected {
            background: var(--highlight) !important;
            font-weight: 700;
            color: #0f172a;
        }

        /* ====== Historial (últimos 5) ====== */
        .history-section {
            padding: clamp(8px, 1.5vw, 16px);
        }

        .hist-list {
            display: flex;
            flex-direction: row;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hist-item {
            padding: clamp(8px, 1.2vw, 14px) clamp(12px, 1.8vw, 20px);
            border-radius: 12px;
            background: #edf4ff;
            border: 1px solid #d6e6ff;
            text-align: center;
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 700;
            min-width: clamp(50px, 8vw, 80px);
        }

        .hist-item:first-child {
            background: var(--highlight);
            border-color: #f0c040;
        }

        /* ====== Footer info ====== */
        .footer-info {
            text-align: center;
            padding: 8px;
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            color: var(--muted);
        }

        /* ====== Modo escritorio (3 columnas) ====== */
        @media (min-width: 1101px) {
            .layout {
                grid-template-columns: 280px 1fr 200px;
                max-width: 1400px;
                margin: 16px auto;
                gap: 16px;
            }

            .hero-section { min-height: 500px; }
            .history-section { min-height: 500px; justify-content: center; }

            .hist-list {
                flex-direction: column;
                gap: 10px;
            }

            .hist-item {
                width: 100%;
                padding: 14px;
                font-size: clamp(1.2rem, 2vw, 1.8rem);
            }
        }

        /* ====== Tablet (2 columnas) ====== */
        @media (min-width: 769px) and (max-width: 1100px) {
            .layout {
                grid-template-columns: 1fr 1fr;
                max-width: 1000px;
                margin: 12px auto;
                gap: 12px;
                padding: 0 8px;
            }

            .history-section {
                grid-column: 1 / -1;
                min-height: auto;
            }

            .hist-list { flex-direction: row; }

            .hero-section { min-height: 250px; }
        }

        /* ====== Móvil ====== */
        @media (max-width: 768px) {
            .layout { padding: 4px; }

            .card { border-radius: 12px; }

            .hero-section { min-height: 180px; padding: 12px 8px; }

            .header-row { flex-direction: column; align-items: flex-start; }

            .actions { justify-content: center; width: 100%; }
            .btn { flex: 1; text-align: center; min-width: 0; }

            .hist-list { gap: 4px; }
            .hist-item { padding: 6px 10px; font-size: 0.95rem; min-width: 45px; }
        }

        @media (max-width: 380px) {
            .numero-grande { font-size: 2.8rem; }
            .hist-item { font-size: 0.85rem; padding: 5px 8px; min-width: 40px; }
        }
    </style>
</head>
<body>
    <main class="layout">
        <!-- Izquierda / Arriba: Número actual -->
        <section class="hero-section card hero-card">
            <p class="label">Número actual</p>
            <div id="numero-grande" class="numero-grande">--</div>
            <p class="sub">Sortea y sigue el ritmo del juego.</p>
        </section>

        <!-- Centro / Medio: Panel de control -->
        <section class="control-section card">
            <div class="header-row">
                <div>
                    <h1>Bingo</h1>
                    <p class="sub">Panel de control del anfitrión.</p>
                </div>
                <div class="qr-wrap">
                    <div id="qr-code"></div>
                    <span>Abrir cartón</span>
                </div>
            </div>

            <div class="actions">
                <button id="sortear-btn" class="btn btn-primary">Sortear número</button>
                <button id="reset-btn" class="btn btn-secondary">Reiniciar ronda</button>
            </div>

            <div id="fin-mensaje" class="fin">Todos los números fueron sorteados.</div>

            <!-- Tabla de todos los números SIEMPRE visible -->
            <div class="table-wrap">
                <table id="bingo-table">
                    <thead>
                        <tr>
                            <th>B</th>
                            <th>I</th>
                            <th>N</th>
                            <th>G</th>
                            <th>O</th>
                        </tr>
                    </thead>
                    <tbody id="bingo-tbody">
                        <!-- Generado por JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Derecha / Abajo: Historial últimos 5 -->
        <aside class="history-section card">
            <p class="label">Últimos 5</p>
            <div id="lista-ultimos" class="hist-list"></div>
        </aside>
    </main>

    <p class="footer-info">Bingo • 90 números • B(1-18) I(19-36) N(37-54) G(55-72) O(73-90)</p>

    <script>
        // ============================================================
        // Configuración de rangos del Bingo
        // ============================================================
        const RANGOS_LETRAS = {
            'B': [1, 18],
            'I': [19, 36],
            'N': [37, 54],
            'G': [55, 72],
            'O': [73, 90]
        };

        const LETRAS_ORDEN = ['B', 'I', 'N', 'G', 'O'];

        // ============================================================
        // Estado del juego
        // ============================================================
        let numerosSorteados = new Set();
        let ultimos = [];
        let ultimoNumero = null;

        // ============================================================
        // Generar cartón de Bingo
        // ============================================================
        function generarCartonBingo() {
            const carton = [];
            for (const letra of LETRAS_ORDEN) {
                const [inicio, fin] = RANGOS_LETRAS[letra];
                const disponibles = [];
                for (let i = inicio; i <= fin; i++) disponibles.push(i);
                for (let i = disponibles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [disponibles[i], disponibles[j]] = [disponibles[j], disponibles[i]];
                }
                carton.push(disponibles.slice(0, 5));
            }

            // Transponer: carton[col][fila] -> carton[fila][col]
            const transpuesto = [];
            for (let fila = 0; fila < 5; fila++) {
                transpuesto.push([]);
                for (let col = 0; col < 5; col++) {
                    transpuesto[fila].push(carton[col][fila]);
                }
            }
            return transpuesto;
        }

        // ============================================================
        // Sortear número
        // ============================================================
        function sortearNumero() {
            if (numerosSorteados.size >= 90) {
                return { letra: '', numero: 0, fin: true };
            }

            let numero = 0;
            let letra = '';

            for (let intento = 0; intento < 1000; intento++) {
                const letraRandom = LETRAS_ORDEN[Math.floor(Math.random() * LETRAS_ORDEN.length)];
                const [min, max] = RANGOS_LETRAS[letraRandom];
                const num = Math.floor(Math.random() * (max - min + 1)) + min;

                if (!numerosSorteados.has(num)) {
                    numero = num;
                    letra = letraRandom;
                    break;
                }
            }

            if (numero === 0) return { letra: '', numero: 0, fin: true };

            numerosSorteados.add(numero);
            ultimoNumero = { letra, numero };
            return { letra, numero };
        }

        // ============================================================
        // Resetear juego
        // ============================================================
        function resetJuego() {
            numerosSorteados.clear();
            ultimos = [];
            ultimoNumero = null;
            document.getElementById('fin-mensaje').style.display = 'none';
            document.getElementById('sortear-btn').disabled = false;
            document.getElementById('numero-grande').textContent = '--';
            document.getElementById('lista-ultimos').innerHTML = '';

            document.querySelectorAll('#bingo-table td').forEach(td => {
                td.classList.remove('selected');
            });
        }

        // ============================================================
        // UI: Mostrar número
        // ============================================================
        function mostrarNumero(letra, numero) {
            const texto = letra + ' ' + numero;
            document.getElementById('numero-grande').textContent = texto;

            ultimos.unshift(texto);
            if (ultimos.length > 5) ultimos = ultimos.slice(0, 5);

            const lista = document.getElementById('lista-ultimos');
            lista.innerHTML = '';
            ultimos.forEach(n => {
                const div = document.createElement('div');
                div.className = 'hist-item';
                div.textContent = n;
                lista.appendChild(div);
            });
        }

        // ============================================================
        // Construir tabla de números (SIEMPRE visible)
        // ============================================================
        function construirTabla() {
            const tbody = document.getElementById('bingo-tbody');
            tbody.innerHTML = '';

            for (let num = 1; num <= 18; num++) {
                const tr = document.createElement('tr');
                LETRAS_ORDEN.forEach((letra, colIndex) => {
                    const td = document.createElement('td');
                    const valor = num + colIndex * 18;
                    td.id = 'num-' + valor;
                    td.textContent = valor;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }
        }

        // ============================================================
        // Generar QR
        // ============================================================
        function generarQR() {
            const qrContainer = document.getElementById('qr-code');
            const baseUrl = window.location.href.split('/').slice(0, -1).join('/') + '/carton_bingo.html';
            new QRCode(qrContainer, {
                text: baseUrl,
                width: 78,
                height: 78,
                colorDark: '#0f3d7a',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        // ============================================================
        // Inicialización
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            construirTabla();
            generarQR();

            document.getElementById('sortear-btn').addEventListener('click', () => {
                const resultado = sortearNumero();

                if (resultado.fin || resultado.numero === 0) {
                    document.getElementById('fin-mensaje').style.display = 'block';
                    document.getElementById('sortear-btn').disabled = true;
                    return;
                }

                const cell = document.getElementById('num-' + resultado.numero);
                if (cell) cell.classList.add('selected');

                mostrarNumero(resultado.letra, resultado.numero);
            });

            document.getElementById('reset-btn').addEventListener('click', resetJuego);
        });
    </script>
</body>
</html>
